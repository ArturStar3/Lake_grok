# Override лимитов памяти для хостов ~8 ГБ RAM (ноутбук / слабый офлайн-ПК).
# Пример:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.resources-8gb.yml up -d --no-build --pull never
#   docker compose -f docker-compose.yml -f docker-compose.direct.yml -f docker-compose.resources-8gb.yml --profile direct-prod up -d --no-build --pull never
#
# Сумма лимитов намеренно ниже физического ОЗУ (оставляем запас ОС + Docker Desktop VM).

services:
  nginx:
    mem_limit: 256m

  tileserver:
    mem_limit: 2.5g

  backend:
    mem_limit: 1.5g

  frontend:
    mem_limit: 1g

  frontend-static:
    mem_limit: 256m
