# Dev reverse-proxy: единая точка входа на :80 (Vite + API + tiles + media/static).
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Отложенный DNS — nginx не падает, если frontend ещё не в сети Docker.
# valid=10s: после рестарта backend/tileserver (новый IP) прокси восстанавливается.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    location /media/ {
        alias /var/www/media/;
        autoindex off;
    }

    location /static/ {
        alias /var/www/static/;
        autoindex off;
    }

    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /admin/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /tiles/ {
        # Карта генерирует сотни запросов при pan/zoom — не пишем access_log,
        # чтобы не забивать диск Docker (json-file) и не блокировать nginx.
        access_log off;
        set $tileserver_upstream tileserver:8080;
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass http://$tileserver_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Path /tiles;
    }

    location / {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
