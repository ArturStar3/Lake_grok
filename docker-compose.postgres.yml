# Production с PostgreSQL 17 в Docker (хостовый Postgres не используется).
#
#   docker compose -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.postgres.yml up -d --no-build --pull never
#
# DB_HOST у backend переопределяется на имя сервиса `postgres`.
# Пароль/имя БД должны совпадать с backend/.env (DB_NAME, DB_USER, DB_PASSWORD).
# Порт 5432 на хост не публикуется — нет конфликта с установленным Windows PostgreSQL.

services:
  postgres:
    image: postgres:17
    container_name: infolake-postgres
    restart: unless-stopped
    init: true
    pull_policy: never
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infolake_db}
      POSTGRES_USER: ${POSTGRES_USER:-infolake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - infolake_pgdata:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  infolake_pgdata:
