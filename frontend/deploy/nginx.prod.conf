# Production: статика из /usr/share/nginx/html + прокси API/tiles + media/static с диска.
#
# Важно: proxy_pass через переменные + resolver Docker DNS (127.0.0.11).
# Иначе nginx резолвит backend/tileserver один раз при старте и после
# рестарта upstream (OOM) навсегда стучится в старый IP.

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # Список объектов карты может содержать тысячи записей. Сжимаем JSON до
    # передачи в браузер, не затрагивая векторные тайлы.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;
    root /usr/share/nginx/html;
    index index.html;

    location /media/ {
        alias /var/www/media/;
        autoindex off;
    }

    location /static/ {
        alias /var/www/static/;
        autoindex off;
    }

    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /admin/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /tiles/ {
        # Карта генерирует сотни запросов при pan/zoom — не пишем access_log,
        # чтобы не забивать диск Docker (json-file) и не блокировать nginx.
        access_log off;
        set $tileserver_upstream tileserver:8080;
        # Сохраняем срез префикса /tiles/, как делал proxy_pass http://tileserver:8080/;
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass http://$tileserver_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Path /tiles;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
