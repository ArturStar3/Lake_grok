# Production: статика из /usr/share/nginx/html + прокси API/tiles + media/static с диска.
server {
    listen 80;
    server_name _;
    client_max_body_size 100M;
    root /usr/share/nginx/html;
    index index.html;

    location /media/ {
        alias /var/www/media/;
        autoindex off;
    }

    location /static/ {
        alias /var/www/static/;
        autoindex off;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /tiles/ {
        # Карта генерирует сотни запросов при pan/zoom — не пишем access_log,
        # чтобы не забивать диск Docker (json-file) и не блокировать nginx.
        access_log off;
        proxy_pass http://tileserver:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Path /tiles;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
