<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ошибка сервера — InfoLake</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(145deg, #f5e8e8 0%, #f8fafc 45%, #efe8f5 100%);
      color: #1f2a38;
    }
    .card {
      max-width: 440px;
      margin: 24px;
      padding: 32px 28px;
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 12px 40px rgba(61, 90, 128, 0.12);
      text-align: center;
    }
    .code { font-size: 3rem; font-weight: 700; color: #b45353; margin: 0; }
    h1 { font-size: 1.25rem; margin: 12px 0 8px; }
    p { color: #64748b; line-height: 1.5; margin: 0 0 20px; }
    a {
      display: inline-block;
      padding: 10px 18px;
      background: #3d5a80;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    a:hover { background: #2f4664; }
  </style>
</head>
<body>
  <div class="card">
    <p class="code">500</p>
    <h1>Внутренняя ошибка сервера</h1>
    <p>
      Произошла непредвиденная ошибка. Попробуйте обновить страницу позже.
      Если проблема повторяется, обратитесь к администратору системы.
    </p>
    <a href="/">На главную</a>
  </div>
</body>
</html>
