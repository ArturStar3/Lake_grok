# =============================================================================
# ОФФЛАЙН-РАЗВЁРТЫВАНИЕ — см. OFFLINE_MIGRATION.md
# =============================================================================
# На машине С интернетом (подготовка пакета):
#   .\export-offline.ps1
#   → infolake_full_offline.tar + offline-package-manifest.txt
#
# На оффлайн-машине (запуск):
#   .\import-and-start.ps1
#   → docker load + docker compose -f docker-compose.yml -f docker-compose.server.yml up ...
#
# Локальная разработка (Vite + HMR через nginx):
#   docker compose --profile dev up
#
# ЗАПРЕЩЕНО на оффлайн-машине:
#   docker compose build | docker compose pull | docker pull
#
# Образы (pull_policy: never — не тянуть из сети):
#   infolake-backend:latest, infolake-nginx:latest (production),
#   infolake-frontend:latest (dev profile), maptiler/tileserver-gl:latest
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: infolake-nginx
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/deploy/upstream-watchdog.sh:/docker-entrypoint.d/40-upstream-watchdog.sh:ro
      - ./backend/media:/var/www/media:ro
      - ./backend/staticfiles:/var/www/static:ro
    depends_on:
      backend:
        condition: service_started
      tileserver:
        condition: service_started
      frontend:
        condition: service_started
        required: false
    pull_policy: never
    mem_limit: 512m
    cpus: "0.5"
    logging: *default-logging
    # Проверяем проксируемый путь, не только статику index.html —
    # иначе контейнер остаётся healthy при мёртвом backend/tileserver DNS.
    # Любой HTTP-код (в т.ч. 401/404) = прокси жив; отсутствие ответа = fail.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null --timeout=5 http://127.0.0.1/tiles/styles/infolake-unified/style.json 2>&1 | grep -q 'HTTP/' && wget -q -S -O /dev/null --timeout=5 http://127.0.0.1/api/v1/ 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s

  tileserver:
    image: maptiler/tileserver-gl:latest
    container_name: tileserver-gl
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./tileserver:/data
    environment:
      TILESERVER_GL_ALLOWED_HOSTS: "localhost,127.0.0.1,host.docker.internal"
    command:
      - "--config"
      - "config.json"
    pull_policy: never
    # ~70GB mbtiles + 17 styles: 4g часто приводит к OOM → новый IP → stale nginx DNS.
    mem_limit: 6g
    cpus: "2.0"
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8080/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: infolake-backend:latest
    container_name: infolake-backend
    pull_policy: never
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./tileserver/data/dem:/app/dem_data:ro
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: host.docker.internal
      DEM_DATA_DIR: /app/dem_data/glo-90
      DJANGO_SERVER: gunicorn
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "2"
      GUNICORN_TIMEOUT: "300"
      FRONTEND_URL: http://localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 3g
    cpus: "2.0"
    logging: *default-logging

  frontend:
    profiles:
      - dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: infolake-frontend:latest
    container_name: infolake-frontend
    pull_policy: never
    restart: unless-stopped
    expose:
      - "5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Относительные URL — браузер ходит через nginx :80 (единый origin).
      VITE_API_URL: ""
      VITE_TILESERVER_URL: /tiles
      VITE_ENABLE_HMR: "false"
      CHOKIDAR_USEPOLLING: "false"
    depends_on:
      - backend
      - tileserver
    mem_limit: 2g
    cpus: "1.5"
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5173/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
