# Production nginx для оффлайн-сервера (статика из dist + reverse-proxy).
# Сборка на машине с интернетом:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml build nginx
# Запуск (оффлайн / production):
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --no-build --pull never
#
# Важно: volumes: !override — заменяет dev.conf bind-mount из базового compose (только media/static).

services:
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile.server
    image: infolake-nginx:latest
    pull_policy: never
    volumes: !override
      - ./backend/media:/var/www/media:ro
      - ./backend/staticfiles:/var/www/static:ro
